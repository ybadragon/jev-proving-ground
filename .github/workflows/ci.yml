name: CI

# Typecheck and lint run alongside the tests because they are the stages a
# local `npm test` skips, and a change that only passes the test runner is
# not the same as a change that passes the build.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # The lint step that used to sit here never linted anything. It called
      # eslint with `--no-eslintrc`, a flag eslint 9 rejects outright, and the
      # error was swallowed by a trailing `|| echo`, so the step went green
      # having done nothing for its entire life. Pinning eslint 8 only moved
      # the failure: with no TypeScript parser configured it could not read a
      # single .ts file.
      #
      # What that step said it was for -- unused variables, unreachable code,
      # obvious mistakes -- the compiler already does, so it is switched on in
      # tsconfig.json and enforced by Typecheck above. That is a real gate
      # rather than a green tick, and it needs no dependency.

      - name: Test
        run: npm test
