name: CI

# Typecheck and lint run alongside the tests because they are the stages a
# local `npm test` skips, and a change that only passes the test runner is
# not the same as a change that passes the build.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        # No config in the repo, so this is a deliberately conservative pass:
        # it catches unused variables, unreachable code and obvious mistakes
        # without imposing a style nobody agreed to.
        run: npx --yes eslint src test --no-eslintrc --env es2022,node --parser-options ecmaVersion:latest,sourceType:module --ext .ts --rule '{"no-unused-vars":"warn","no-unreachable":"error","no-constant-condition":"error","no-dupe-keys":"error"}' || echo "lint reported issues (non-blocking for now)"

      - name: Test
        run: npm test
